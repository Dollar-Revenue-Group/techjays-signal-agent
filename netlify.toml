# Netlify settings for the Techjays estimator signal agent site.
# The site is a single static page in /docs. There is no build step.
#
# Credit safety: on Netlify's credit-based plans a production deploy costs
# 15 credits, while branch deploys and Deploy Previews cost 0 to create.
# The `ignore` command below cancels every production-context build, so
# connecting this repo to Netlify can never create a paid production deploy.
# Only the `staging` branch deploy (staging--<site>.netlify.app) is built.

[build]
  publish = "docs"
  command = ""
  ignore = "if [ \"$CONTEXT\" = \"production\" ]; then echo 'Production deploys are disabled for this repo'; exit 0; else exit 1; fi"

[context.branch-deploy]
  command = ""
